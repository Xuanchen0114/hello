name: Review web server

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  run-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start server and capture page
        run: |
          set -euo pipefail
          uvicorn main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            if kill -0 "$SERVER_PID" 2>/dev/null; then
              kill "$SERVER_PID"
            fi
          }
          trap cleanup EXIT

          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000 -o page.html; then
              break
            fi
            sleep 1
          done

          if [ ! -f page.html ]; then
            echo "Server did not become ready in time" >&2
            exit 1
          fi

          echo "Captured page preview:"
          head -n 20 page.html

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-server-review
          path: |
            page.html
            server.log
          if-no-files-found: warn
